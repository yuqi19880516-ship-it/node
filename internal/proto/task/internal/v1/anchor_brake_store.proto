syntax = "proto3";
package task.internal.v1;

option go_package = "github.com/TrueOpen/node/x/task/internal/types";

// AnchorBrakePendingEffect is a Worker slash for a REJECT verdict that the
// per-model brake withheld. It keeps exactly what the slash would have been
// applied with, so a release can apply it unchanged. The operator is stored as
// codec bytes.
message AnchorBrakePendingEffect {
  bytes session_id = 1;
  bytes task_id = 2;
  bytes operator_address = 3;
  string fault_type = 4;
  bytes evidence_digest = 5;
  uint32 slash_bps = 6;
  uint64 requested_amount = 7;
  uint64 withheld_height = 8;
}
